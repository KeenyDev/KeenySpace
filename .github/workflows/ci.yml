name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.10.8"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --all-packages --all-extras
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format
        run: uv run ruff format --check .
      - name: no internal planning references in code
        # Comments and docstrings must read standalone: .planning/ is not in the
        # repository, so an id like D-11 or "Phase 4" resolves to nothing for a
        # reader who cloned it, and MCP tool docstrings ship to clients verbatim.
        run: |
          if grep -rnE '\b(D|WR|CR|REQ|T|G|F|AUTH|MCP|WS|CLI|SC|ADMIN|REL|DEP)-[0-9]+|RESEARCH §|\bWave [0-9]|\bPhase [0-9]' \
              packages --include='*.py'; then
            echo "::error::Remove internal planning references; state the decision in plain words instead."
            exit 1
          fi
      - name: release-notes assembler
        run: uv run pytest scripts/tests -q
      - name: mypy
        run: |
          uv run mypy --strict \
            packages/server/keenyspace_server \
            packages/client/keenyspace \
            packages/shared/keenyspace_shared

  test-server:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.2-alpine
        env:
          POSTGRES_DB: keenyspace_test
          POSTGRES_USER: keenyspace
          POSTGRES_PASSWORD: testpw
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    env:
      KEENYSPACE_DB__URL: postgresql+asyncpg://keenyspace:testpw@localhost:5432/keenyspace_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.10.8"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --all-packages --all-extras
      - name: Install PostgreSQL 17 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
      - name: pytest server
        working-directory: packages/server
        run: uv run --package keenyspace-server pytest tests/ -x -q -m "not real_idp"

  test-client:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.10.8"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --all-packages --all-extras
      - name: pytest client
        run: uv run --package keenyspace pytest packages/client/tests/ -x -q
