services:
  prometheus:
    image: prom/prometheus:v3.12.0
    configs:
      - source: prometheus_config
        target: /etc/prometheus/prometheus.yml
    ports:
      - "127.0.0.1:9090:9090"
    restart: unless-stopped

  loki:
    image: grafana/loki:3.4
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - loki-data:/loki
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.4
    volumes:
      # Linux hosts only for log scraping (macOS Docker Desktop: path is inside the VM, see docs/install.md)
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./promtail-config.yml:/etc/promtail/config.yml:ro
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.4.4
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: ${GF_AUTH_ANONYMOUS_ENABLED:-false}
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    depends_on:
      - loki
      - prometheus
    restart: unless-stopped

volumes:
  loki-data:
  grafana-data:

configs:
  prometheus_config:
    content: |
      global:
        scrape_interval: 15s
      scrape_configs:
        # Internal metrics listener (KEENYSPACE_METRICS_PORT, default 9100). It is
        # not published to the host; Prometheus reaches it over the compose network,
        # so run this file in the same project as docker-compose.yml.
        - job_name: keenyspace
          static_configs:
            - targets: ['keenyspace:9100']
          metrics_path: /metrics
