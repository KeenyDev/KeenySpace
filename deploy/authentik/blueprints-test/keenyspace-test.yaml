# Test-only Authentik blueprint — seeds a service account + app password for the
# testcontainers real_idp e2e test (D-23).
#
# SECURITY: These credentials are test-only placeholders (clearly marked values).
# They MUST NOT appear in the production blueprint (keenyspace.yaml).
# grep -c ks-test-svc deploy/authentik/blueprints/keenyspace.yaml must return 0.
#
# This file lives in deploy/authentik/blueprints-test/ — a directory the production
# compose (docker-compose.yml) does NOT mount. It is mounted into Authentik ONLY by
# docker-compose.authentik-test.yml (the real_idp testcontainers lane). A plain
# `docker compose up` therefore never provisions this service account, so the test
# credential cannot leak into a dogfood/production deployment (security T-03.1-06).
version: 1
metadata:
  name: keenyspace-test-seed
  labels:
    blueprints.goauthentik.io/instance: keenyspace-test-seed
entries:
  # Declared here as well (identical to keenyspace.yaml) because blueprint files
  # apply independently and in no guaranteed order; !KeyOf below needs them.
  - model: authentik_core.group
    id: ks-test-users-group
    state: present
    identifiers:
      name: keenyspace-users
    attrs:
      name: keenyspace-users
      is_superuser: false
  - model: authentik_core.group
    id: ks-test-admins-group
    state: present
    identifiers:
      name: keenyspace-admins
    attrs:
      name: keenyspace-admins
      is_superuser: false

  # Admin membership: the drill calls /v1/admin/backup and /v1/admin/restore
  # with a key minted by this account.
  - model: authentik_core.user
    id: ks-test-user
    identifiers:
      username: ks-test-svc
    attrs:
      name: KeenySpace Test Service Account
      type: service_account
      is_active: true
      groups:
        - !KeyOf ks-test-users-group
        - !KeyOf ks-test-admins-group

  - model: authentik_core.token
    id: ks-test-token
    identifiers:
      identifier: ks-test-svc-apppassword
    attrs:
      user: !KeyOf ks-test-user
      intent: app_password
      key: ks-test-app-password-known-value-32chars
      expiring: false
